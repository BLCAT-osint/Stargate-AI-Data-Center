<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美国星际之门数据中心地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-copy">
        <h1>美国星际之门数据中心地图</h1>
      </div>
      <div class="hero-panel">
        <div class="metric-card">
          <span class="metric-label">项目数量</span>
          <strong id="metric-total">0</strong>
        </div>
        <div class="metric-card">
          <span class="metric-label">总规划容量</span>
          <strong id="metric-capacity">0 MW</strong>
        </div>
        <div class="metric-card">
          <span class="metric-label">覆盖区域数</span>
          <strong id="metric-states">0</strong>
        </div>
      </div>
    </header>

    <section class="toolbar">
      <label class="search-box">
        <span>搜索</span>
        <input id="search-input" type="text" placeholder="项目 / 公司 / 州名">
      </label>
      <label class="status-filter">
        <span>状态筛选</span>
        <select id="status-filter">
          <option value="all">全部状态</option>
          <option value="Online">部分上线</option>
          <option value="Building">建设中</option>
          <option value="Groundbreaking">已动工</option>
          <option value="Planned">规划中</option>
        </select>
      </label>
    </section>

    <main class="content-grid">
      <section class="map-card">
        <div class="card-head">
          <div>
            <h2>地图总览</h2>
          </div>
          <div class="legend">
            <span><i class="dot dot-online"></i>部分上线</span>
            <span><i class="dot dot-building"></i>建设中</span>
            <span><i class="dot dot-ground"></i>已动工</span>
            <span><i class="dot dot-plan"></i>规划中</span>
          </div>
        </div>
        <div id="map"></div>
      </section>

      <aside class="side-card">
        <div class="card-head">
          <div>
            <h2>项目清单</h2>
          </div>
        </div>
        <div id="project-list" class="project-list"></div>
      </aside>
    </main>

    <section class="table-card">
      <div class="card-head">
        <div>
          <h2>详细数据表</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>项目名称</th>
              <th>参与公司</th>
              <th>地点</th>
              <th>投资额</th>
              <th>电力规模</th>
              <th>面积</th>
              <th>当前状态</th>
              <th>预计完工</th>
              <th>描述</th>
              <th>区域</th>
              <th>数据来源</th>
              <th>经度</th>
              <th>纬度</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
